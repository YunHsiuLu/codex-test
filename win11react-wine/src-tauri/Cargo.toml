[package]
name = "win11react-wine"
version = "0.1.0"
description = "Win11React Windows game launcher for macOS"
authors = ["Win11React contributors"]
license = "CC0-1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]
