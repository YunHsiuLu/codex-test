<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#5653a6"><title>Together｜讓合作更靠近</title><link id="notification-icon" rel="icon" type="image/svg+xml"><link rel="stylesheet" href="/style.css"></head>
<body class="signed-out">
<header class="topbar"><a class="brand" href="/" aria-label="Together 首頁"><span class="brand-mark">t<span>●</span></span><strong>together</strong><span class="brand-caption">讓合作更靠近</span></a><label class="global-search"><span data-icon="search"></span><input id="search" placeholder="搜尋訊息、想法與檔案" aria-label="搜尋訊息"><kbd>⌘ K</kbd></label><div class="top-actions"><span class="local-label">團隊工作區</span><button id="manage-accounts" class="logout-button" hidden>帳號審核</button><button id="logout" class="logout-button">登出</button><button id="profile" class="avatar profile" aria-label="修改顯示名稱">你</button></div></header>
<div class="app-shell">
<nav class="rail" aria-label="主導覽"><button class="rail-item active" id="nav-chat"><span data-icon="message"></span><span>聊天</span></button><button class="rail-item" id="nav-files"><span data-icon="folder"></span><span>檔案</span></button><button class="rail-item" id="nav-members"><span data-icon="users"></span><span>成員</span></button><div class="rail-bottom"><button class="rail-item" id="help"><span data-icon="help"></span><span>說明</span></button><span class="rail-dot"></span></div></nav>
<aside class="sidebar"><div class="sidebar-heading"><h1>聊天</h1><button class="icon-button" id="new-room" title="建立頻道" aria-label="建立頻道"><span data-icon="edit"></span></button></div><div class="workspace-card"><span class="workspace-logo" data-icon="layers"></span><div><strong>我們的工作空間</strong><span>好點子，從對話開始</span></div><span data-icon="chevron"></span></div><div class="sidebar-filters"><button class="selected" data-filter="all">所有頻道</button><button data-filter="unread">未讀<span id="unread-count"></span></button></div><div class="section-label"><span>工作區頻道</span><button class="plain-button" id="add-channel" aria-label="新增頻道">＋</button></div><div id="room-list" class="room-list"></div><div class="sidebar-note"><span data-icon="sparkles"></span><strong>一起，讓事情發生。</strong><p>一個想法、一段對話，<br>都是合作的開始。</p><span class="note-decoration"></span></div><div class="sidebar-footer"><span class="connection-dot"></span><span id="connection">正在連線</span><span class="version">v1.1</span></div></aside>
<main class="main"><header class="channel-header"><button id="mobile-menu" class="icon-button" aria-label="展開頻道"><span data-icon="menu"></span></button><span id="channel-icon" class="channel-icon"></span><div class="channel-title"><h2 id="channel-name">團隊大廳</h2><p id="channel-description"></p></div><div class="channel-actions"><div id="member-stack" class="member-stack"></div><button id="details-toggle" class="icon-button" title="頻道資訊" aria-label="頻道資訊"><span data-icon="info"></span></button></div></header><div class="tabs"><button class="active" data-tab="chat">對話</button><button data-tab="files">共用檔案</button><span class="channel-public"><span data-icon="globe"></span>公開頻道</span></div><div id="search-summary" class="search-summary" hidden></div><div id="messages" class="messages" aria-label="頻道訊息" aria-live="polite"></div><div id="files-view" class="files-view" hidden></div><section class="composer-area"><div id="reply-banner" class="reply-banner" hidden></div><form id="composer" class="composer"><textarea id="message-input" rows="2" maxlength="5000" placeholder="分享你的想法，讓對話繼續…" aria-label="輸入訊息"></textarea><div id="attachment-preview" hidden></div><div class="composer-toolbar"><div class="compose-tools"><button type="button" class="icon-button" id="attach" title="附加檔案（最多 5 MB）" aria-label="附加檔案"><span data-icon="paperclip"></span></button><button type="button" class="icon-button" id="emoji" title="插入表情" aria-label="插入表情"><span data-icon="smile"></span></button><span class="tool-separator"></span><span class="format-hint">純文字訊息</span></div><div class="send-tools"><span>Enter 傳送，Shift ＋ Enter 換行</span><button class="send-button" id="send" type="submit" aria-label="傳送訊息"><span data-icon="send"></span></button></div></div></form><div class="composer-footnote"><span data-icon="lock"></span>訊息儲存在這台電腦的工作區，所有成員皆可閱讀。</div><input id="file-input" type="file" hidden><div id="emoji-picker" class="emoji-picker" hidden></div></section></main>
<aside id="details" class="details" hidden></aside></div>
<dialog id="dialog"><form id="dialog-form"><div class="dialog-heading"><span class="dialog-logo" data-icon="layers"></span><button type="button" id="close-dialog" class="icon-button" aria-label="關閉"><span data-icon="x"></span></button></div><div id="dialog-content"></div><p id="dialog-error" class="error" role="alert"></p><button id="dialog-submit" class="primary-button" type="submit">儲存</button></form></dialog><div id="toast" class="toast" role="status" hidden></div><script type="module" src="/app.js"></script>
</body></html>
